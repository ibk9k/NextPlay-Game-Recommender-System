[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-game-recommender"
version = "0.1.0"
description = "A proposal-driven Steam game recommender with content, collaborative, and neural retrieval."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2",
  "ijson>=3.3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]
neural = ["sentence-transformers>=3.4,<6"]

[project.scripts]
game-rs = "game_recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
game_recommender = ["web/*", "demo/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

